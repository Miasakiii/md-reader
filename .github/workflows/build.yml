name: Build MD Reader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"

          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $package_version." >&2
            exit 1
          fi

          if ! awk -v heading="## [${package_version}]" '
            $0 == heading || index($0, heading " - ") == 1 { found = 1 }
            END { exit found ? 0 : 1 }
          ' CHANGELOG.md; then
            echo "CHANGELOG.md has no section for version $package_version." >&2
            exit 1
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend logic
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test Rust backend
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint Rust backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg,app
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build Tauri bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Package Windows portable assets
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseDir = "release/v$version"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          $portableExe = "$releaseDir/MD-Reader-$version-portable.exe"
          Copy-Item "src-tauri/target/release/md-reader.exe" $portableExe

          @"
          MD Reader v$version 便携版使用说明
          ================================

          1. 解压后将 MD-Reader-$version-portable.exe 放到任意文件夹
          2. 双击运行，无需安装
          3. 可通过打开对话框或拖入窗口读取 .md / .markdown / .txt / .tex / .log；.log 始终只读
          4. 安装版仅注册 .md / .markdown / .txt 系统文件关联，不接管 .tex / .log；便携版不会自动注册关联
          5. 阅读进度、窗口大小与最近文件会自动保存

          系统要求：Windows 10/11（需 WebView2 运行时，通常已安装）

          项目主页：https://github.com/Miasakiii/md-reader
          "@ | Set-Content -Path "$releaseDir/使用说明.txt" -Encoding UTF8

          Compress-Archive -Path $portableExe, "$releaseDir/使用说明.txt" -DestinationPath "$releaseDir/MD-Reader-$version-portable.zip" -Force

          $setup = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "$releaseDir/MD-Reader-$version-setup.exe"

      - name: Upload Windows release assets
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-v${{ steps.version.outputs.version }}
          path: |
            release/v${{ steps.version.outputs.version }}/MD-Reader-${{ steps.version.outputs.version }}-setup.exe
            release/v${{ steps.version.outputs.version }}/MD-Reader-${{ steps.version.outputs.version }}-portable.exe
            release/v${{ steps.version.outputs.version }}/MD-Reader-${{ steps.version.outputs.version }}-portable.zip

      - name: Upload macOS bundles
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: macos-latest-bundles
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux bundles
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-22.04-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    # The release intentionally tolerates partial macOS/Linux matrix failures.
    # A failed Windows build produces no run-scoped artifact, so the download
    # step fails before the GitHub Release action can create a release.
    if: >-
      ${{
        always() &&
        !cancelled() &&
        startsWith(github.ref, 'refs/tags/v') &&
        needs.verify.result == 'success'
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          {
            echo "## MD Reader v${version}"
            echo ""
            awk -v heading="## [${version}]" '
              $0 == heading || index($0, heading " - ") == 1 {
                in_section = 1
                next
              }
              in_section && /^## \[/ { exit }
              in_section { print }
            ' CHANGELOG.md
          } > "release-notes-v${version}.md"

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: windows-release-v${{ steps.version.outputs.version }}
          path: assets/windows

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          shopt -s nullglob
          for f in assets/windows/*-setup.exe assets/windows/*-portable.exe assets/windows/*-portable.zip; do
            [ -f "$f" ] && cp "$f" release-assets/
          done
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MD Reader v${{ steps.version.outputs.version }}
          body_path: release-notes-v${{ steps.version.outputs.version }}.md
          draft: false
          allowUpdates: true
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
